name               = "bosta-orders-returned-scanner"
main               = "index.js"
compatibility_date = "2025-01-01"
workers_dev        = true

[observability]
enabled = true

# ─── D1 ──────────────────────────────────────────────
# الـ binding دايمًا "DB" — أي اسم تاني والكتابة بتفشل بصمت
[[d1_databases]]
binding       = "DB"
database_name = "ecommoda-dev-logs"
database_id   = "90db62d3-bd7e-4d92-912b-10fc78eeb565"

# ─── Vars (نص عادي — مش أسرار) ────────────────────────
# دي بتتطبّق فعليًا مع Workers Builds.
# ⚠️ LOCATION_ID لازم يفضل هنا — الأداة دي أداة مخزون (بترجّع قطع مرتجعة
# للمخزون)، وضياعه بيوقّف كل عمليات الاسترجاع (requireLocationId بيرمي خطأ
# واضح بدل ما يتحول لـ GID غلط بصمت — راجع index.js §HELPERS).
[vars]
SHOP_DOMAIN = "6c7e1a-53.myshopify.com"
LOCATION_ID = "98849620290"

# ─── الأسرار (متكتبش هنا أبدًا) ────────────────────────
# WORKER_SECRET · CLIENT_ID · CLIENT_SECRET · BOSTA_API_KEY
# Worker → Settings → Variables and Secrets → علّم Secret
# وبعدها: Deployments → Version History → ⋯ → Promote version
